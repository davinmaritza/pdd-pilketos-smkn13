<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pdd tunduk</title>
  <link rel="icon" type="image/png" href="logo-mpk.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #8ACE00;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .brat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 540px;
    }

    .brat-title {
      font-size: clamp(48px, 11vw, 76px);
      font-weight: 400;
      letter-spacing: -2px;
      line-height: 1;
      filter: blur(0.75px);
      margin-bottom: 12px;
      text-transform: lowercase;
    }

    .brat-sub {
      font-size: clamp(18px, 4.5vw, 26px);
      font-weight: 400;
      letter-spacing: -0.6px;
      filter: blur(0.55px);
      margin-bottom: 44px;
      text-transform: lowercase;
    }

    .brat-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .brat-btn {
      display: block;
      padding: 14px 24px;
      background: #000000;
      color: #8ACE00;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
      border-radius: 999px;
      text-transform: lowercase;
      transition: transform 0.15s ease, opacity 0.15s ease;
      filter: blur(0.2px);
    }

    .brat-btn:hover {
      transform: scale(1.04);
      opacity: 0.9;
    }

    .brat-btn:active {
      transform: scale(0.97);
    }

    .brat-btn.outline {
      background: transparent;
      color: #000000;
      border: 2.5px solid #000000;
    }

    .brat-btn.outline:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      letter-spacing: -0.3px;
      text-transform: lowercase;
      filter: blur(0.3px);
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="brat-box">
    <div class="brat-title">pdd tunduk</div>
    <div class="brat-sub">udah 5 tahun pdd ni gue</div>

    <div class="brat-links">
      <a href="administrasi.html" class="brat-btn">pilketos ➔</a>
      <a href="hgn/index.html" class="brat-btn outline">hgn 2026 ➔</a>
    </div>

    <footer>
      davin maritza · smkn 13 bandung
    </footer>
  </div>

</body>
</html>
