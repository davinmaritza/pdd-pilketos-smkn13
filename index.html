<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#8ACE00">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>pdd tunduk</title>
  <link rel="icon" type="image/png" href="logo-mpk.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      background-color: #8ACE00;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      text-align: center;
    }

    .brat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 540px;
    }

    .brat-title {
      font-size: clamp(48px, 11vw, 76px);
      font-weight: 400;
      letter-spacing: -2px;
      line-height: 1;
      filter: blur(0.75px);
      margin-bottom: 12px;
      text-transform: lowercase;
    }

    .brat-sub {
      font-size: clamp(18px, 4.5vw, 26px);
      font-weight: 400;
      letter-spacing: -0.6px;
      filter: blur(0.55px);
      margin-bottom: 44px;
      text-transform: lowercase;
    }

    .brat-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .brat-btn {
      display: block;
      padding: 16px 24px;
      background: #000000;
      color: #8ACE00;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
      border-radius: 999px;
      text-transform: lowercase;
      filter: blur(0.2px);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 120ms ease-out, opacity 120ms ease-out;
    }

    .brat-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .brat-btn.outline {
      background: transparent;
      color: #000000;
      border: 2.5px solid #000000;
    }

    .brat-btn.outline:active {
      background: rgba(0, 0, 0, 0.12);
      transform: scale(0.96);
    }

    @media (hover: hover) and (pointer: fine) {
      .brat-btn:hover {
        transform: scale(1.03);
        opacity: 0.9;
      }
      .brat-btn.outline:hover {
        background: rgba(0, 0, 0, 0.08);
      }
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      letter-spacing: -0.3px;
      text-transform: lowercase;
      filter: blur(0.3px);
      opacity: 0.75;
    }
  </style>
</head>
<body>

  <div class="brat-box">
    <div class="brat-title">pdd tunduk</div>
    <div class="brat-sub">udah 5 tahun pdd ni gue</div>

    <div class="brat-links">
      <a href="administrasi.html" class="brat-btn">pilketos ➔</a>
      <a href="hgn/index.html" class="brat-btn outline">hgn 2026 ➔</a>
    </div>

    <footer>
      davin maritza · smkn 13 bandung
    </footer>
  </div>

</body>
</html>
