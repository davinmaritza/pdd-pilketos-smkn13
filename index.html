<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#8ACE00">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>pdd only</title>
  <link rel="icon" type="image/png" href="logo-mpk.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      background-color: #8ACE00;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      text-align: center;
    }

    .brat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 540px;
    }

    .brat-title {
      font-size: clamp(48px, 11vw, 76px);
      font-weight: 400;
      letter-spacing: -2px;
      line-height: 1;
      filter: blur(0.75px);
      margin-bottom: 12px;
      text-transform: lowercase;
    }

    .brat-sub {
      font-size: clamp(18px, 4.5vw, 26px);
      font-weight: 400;
      letter-spacing: -0.6px;
      filter: blur(0.55px);
      margin-bottom: 44px;
      text-transform: lowercase;
    }

    .brat-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }

    .brat-btn {
      display: block;
      padding: 16px 24px;
      background: #000000;
      color: #8ACE00;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
      border-radius: 999px;
      text-transform: lowercase;
      filter: blur(0.2px);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 120ms ease-out, opacity 120ms ease-out;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .brat-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    .brat-btn.outline {
      background: transparent;
      color: #000000;
      border: 2.5px solid #000000;
    }

    .brat-btn.outline:active {
      background: rgba(0, 0, 0, 0.12);
      transform: scale(0.96);
    }

    @media (hover: hover) and (pointer: fine) {
      .brat-btn:hover {
        transform: scale(1.03);
        opacity: 0.9;
      }
      .brat-btn.outline:hover {
        background: rgba(0, 0, 0, 0.08);
      }
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      letter-spacing: -0.3px;
      text-transform: lowercase;
      filter: blur(0.3px);
      opacity: 0.75;
    }

    /* Brat Modal */
    .brat-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .brat-modal-overlay.active {
      display: flex;
    }

    .brat-modal {
      background: #8ACE00;
      border: 3px solid #000000;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 8px 8px 0px #000000;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .brat-modal-title {
      font-size: 26px;
      font-weight: 700;
      text-transform: lowercase;
      letter-spacing: -1px;
      filter: blur(0.3px);
      margin-bottom: 6px;
    }

    .brat-modal-desc {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
      text-transform: lowercase;
      opacity: 0.85;
    }

    .brat-input {
      width: 100%;
      padding: 14px 18px;
      border: 2.5px solid #000000;
      border-radius: 999px;
      background: #FFFFFF;
      color: #000000;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      text-align: center;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .brat-input:focus {
      background: #FAFAFA;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
    }

    .brat-modal-err {
      color: #D32F2F;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      min-height: 18px;
      text-transform: lowercase;
    }

    .brat-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
  <script src="pdd-security.js"></script>
</head>
<body>

  <div class="brat-box">
    <div class="brat-title">hi there</div>
    <div class="brat-sub">pdd only ya gais hahay</div>

    <div class="brat-links">
      <a href="administrasi.html" class="brat-btn" data-gate-target="administrasi.html">pilketos ➔</a>
      <a href="hgn/index.html" class="brat-btn outline" data-gate-target="hgn/index.html">hgn 2026 ➔</a>
    </div>

    <footer>
      davin maritza · smkn 13 bandung
    </footer>
  </div>

  <!-- Password Modal -->
  <div id="bratModal" class="brat-modal-overlay">
    <div class="brat-modal">
      <div class="brat-modal-title">pdd only</div>
      <div class="brat-modal-desc">masukin password dulu ya:</div>
      <form id="bratGateForm">
        <input type="password" id="bratPasswordInput" class="brat-input" placeholder="password..." autocomplete="off" />
        <div id="bratError" class="brat-modal-err"></div>
        <div class="brat-modal-actions">
          <button type="submit" class="brat-btn">masuk ➔</button>
          <button type="button" id="bratCancelBtn" class="brat-btn outline" style="padding: 10px; font-size: 14px;">batal</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let pendingTarget = null;
    const modal = document.getElementById('bratModal');
    const input = document.getElementById('bratPasswordInput');
    const err = document.getElementById('bratError');
    const cancelBtn = document.getElementById('bratCancelBtn');

    document.querySelectorAll('[data-gate-target]').forEach(el => {
      el.addEventListener('click', function(e) {
        const target = this.getAttribute('data-gate-target');
        if (window.PDDSecurity && window.PDDSecurity.isAuthorized()) {
          // Already unlocked
          return true;
        }
        e.preventDefault();
        pendingTarget = target;
        err.textContent = '';
        input.value = '';
        modal.classList.add('active');
        setTimeout(() => input.focus(), 100);
      });
    });

    cancelBtn.addEventListener('click', function() {
      modal.classList.remove('active');
      pendingTarget = null;
    });

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        modal.classList.remove('active');
        pendingTarget = null;
      }
    });

    document.getElementById('bratGateForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      err.textContent = '';
      const val = input.value;
      if (!val) return;
      const ok = await window.PDDSecurity.verifyAndAuthorize(val);
      if (ok) {
        modal.classList.remove('active');
        if (pendingTarget) {
          window.location.href = pendingTarget;
        }
      } else {
        err.textContent = 'password salah cuy!';
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
