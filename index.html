<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDD Tunduk — Davin Maritza</title>
  <link rel="icon" type="image/png" href="logo-mpk.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #090D12;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    .container {
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .logos {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      padding: 6px 12px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .logos img {
      height: 28px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    h1 {
      font-family: 'League Spartan', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94A3B8;
      font-size: 15px;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111720;
      border: 1px solid #1E293B;
      padding: 18px 22px;
      border-radius: 14px;
      text-decoration: none;
      color: #FFFFFF;
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background: #16202C;
      border-color: #D4AF37;
      transform: translateY(-2px);
    }

    .link-card:active {
      transform: translateY(0);
    }

    .link-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .link-title {
      font-family: 'League Spartan', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.3px;
    }

    .link-desc {
      font-size: 12px;
      color: #64748B;
      font-weight: 400;
      margin-top: 2px;
    }

    .arrow {
      color: #D4AF37;
      font-size: 20px;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .link-card:hover .arrow {
      transform: translateX(3px);
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logos">
      <img src="logo-smkn13.png" alt="Logo SMKN 13">
      <img src="LOGO OSIS.png" alt="Logo OSIS">
      <img src="logo-mpk.png" alt="Logo MPK">
    </div>

    <h1>PDD Tunduk.</h1>
    <p class="subtitle">Udah 5 tahun PDD nih gue.</p>

    <div class="links">
      <a href="administrasi.html" class="link-card">
        <div class="link-info">
          <span class="link-title">Pilketos</span>
          <span class="link-desc">SMKN 13 Bandung · Praja Satya Nayaka</span>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="hgn/index.html" class="link-card">
        <div class="link-info">
          <span class="link-title">HGN 2026</span>
          <span class="link-desc">Hari Guru Nasional · Internal Portal</span>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>

    <footer>
      Davin Maritza · SMKN 13 Bandung
    </footer>
  </div>

</body>
</html>
